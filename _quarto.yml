project:
  type: book

book:
  title: "Modern R for Public Health Practitioners"
  subtitle: "CT DPH DMAG Training"
  author: "Alexander Senetcky, MPH"
  date: "06/22/2026"
  description: >
    A project-based course for public health practitioners who
    want to become confident R users by buidling a report
    that grows with every chapter.

  search: true
  repo-url: https://github.com/CT-DPH-Data-Management-and-Governance/modern-r-for-public-health-practitioners
  repo-actions: [edit]

  sidebar:
    style: floating

  page-footer:
    left: |
      [Connecticut Department of Public Health](https://portal.ct.gov/dph)
    right: |
      Made with [Quarto](https://quarto.org) and [GitHub](https://github.com).


  chapters:
    - index.qmd 
    - chapters/00-orientation/preface.qmd
    - part: "Introduction and Process"
      chapters:
        - chapters/00-orientation/index.qmd
    - part: "Working with real data"
      chapters:
        - chapters/01-working-with-real-data/index.qmd
        - chapters/01-working-with-real-data/project.qmd
        - chapters/02-cleaning-data/index.qmd
        - chapters/02-cleaning-data/project.qmd
    - part: "Data Visualization"
      chapters:
        - chapters/03-data-visualization/index.qmd
        - chapters/03-data-visualization/mapview-leaflet.qmd
        - chapters/03-data-visualization/project.qmd
    - part: "Checkpoint"
      chapters:
        - chapters/04-project-checkin/index.qmd
    - part: "Managing Code"
      chapters:
        - chapters/version-control/index.qmd
        - chapters/team-github/index.qmd
        - chapters/code-style/index.qmd
        - chapters/documenting-work/index.qmd
    - part: "Intermediate R: Automating the Manual Steps"
      chapters:
        - chapters/apis-functions/index.qmd
        - chapters/apis-functions/project.qmd
    - part: "Security Basics"
      chapters:
        - chapters/secrets/index.qmd
    - part: "Further Reading"
      chapters:
        - chapters/further-reading/index.qmd
        - chapters/further-reading/joins.qmd
        - chapters/further-reading/excel-files.qmd
        - chapters/further-reading/writing-files.qmd
  page-navigation: true


format:
  html:
    theme:
      light: [cosmo, theme-ctdph.scss]
    code-copy: true


execute:
  freeze: auto
  echo: true
  warning: false
  message: false




