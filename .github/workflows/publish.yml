on:
  push:
    branches:
      - main

name: Render and Publish

# you need these permissions to publish to GitHub pages
permissions:
  contents: write
  pages: write

# Two pushes to main in quick succession would otherwise race each other to
# gh-pages. Queue them instead. NOT cancel-in-progress: killing a run partway
# through its push to the gh-pages branch is how you get a half-published
# site, and a superseded build is cheap next to that.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # sf/units/tigris etc. need these system libs at runtime, not just
      # build time — renv restore alone doesn't install them.
      #
      # Deliberately NOT listed here: pandoc (Quarto ships its own) and make
      # (preinstalled on GitHub runners). Recommends are left ON — some of
      # these pull runtime data packages (proj-data and friends) that sf and
      # tigris need, and a missing one fails at render time, not install time.
      - name: Install spatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev gdal-bin \
            libabsl-dev libfontconfig1-dev libfreetype6-dev libx11-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No `tinytex:` input on purpose - not installing LaTeX is the
        # default. _quarto.yml declares `format: html` only, so nothing here
        # renders to PDF. If a `pdf:` format is ever added, add
        # `with: {tinytex: true}` back.

      # From https://github.com/r-lib/actions/tree/v2-branch/setup-r
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          # renv.lock already points at Posit Package Manager's binary
          # endpoint, so restore pulls prebuilt Linux binaries rather than
          # compiling. This keeps the two in agreement.
          use-public-rspm: true

      # Installs packages from renv.lock (readr, dplyr, ggplot2, arrow,
      # duckdb, sf, etc.). Caches the library, keyed on the renv.lock hash,
      # so only newly added packages are fetched on later runs.
      #
      # Note: most chapters never execute here — `execute: freeze: auto` plus
      # a committed _freeze/ means Quarto reuses stored results. The restore
      # is what keeps the un-frozen chapters renderable.
      - name: Restore R packages
        uses: r-lib/actions/setup-renv@v2

      # NOTE: If Publishing to GitHub Pages, set the permissions correctly (see top of this yaml)
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          # this secret is always available for github actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Other publish targets (Netlify, Connect, Confluence) are documented at
# https://github.com/quarto-dev/quarto-actions/blob/main/examples/example-03-dependencies.md
