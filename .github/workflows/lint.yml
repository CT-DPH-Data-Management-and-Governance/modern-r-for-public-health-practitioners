name: Lint

# Informational checks only — nothing here is required to pass.
# Every step runs with continue-on-error so issues are flagged (as a
# yellow warning on the step) without blocking pushes, PRs, or merges.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: extractions/setup-just@v4

      - name: Install air
        run: |
          curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install yamllint
        run: pipx install yamllint

      - name: R formatting (air)
        continue-on-error: true
        run: just fmt-check

      - name: YAML lint
        continue-on-error: true
        run: just yaml-lint

      - name: Quarto render check (no-execute)
        continue-on-error: true
        run: just render-dry
